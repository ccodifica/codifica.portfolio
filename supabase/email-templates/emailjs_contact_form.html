<!--
  EmailJS Template: "Contato / Lead notification"
  Substitui o conteúdo do template_736yr0u (que hoje atende Fale Conosco + cadastro).
  Sent TO: ccodifica@gmail.com (configurado no template, "To Email" pode ser fixo)
  Variáveis: {{from_name}}, {{from_email}}, {{service}}, {{message}}, {{reply_to}}
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <title>Novo contato Codifica</title>
</head>
<body style="margin:0; padding:0; background-color:#F4F5F8; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color:#F4F5F8; padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:600px; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 8px 32px rgba(15,23,42,0.06);" border="0" cellpadding="0" cellspacing="0">
          <tr>
            <td style="background:linear-gradient(135deg, #8B3DF5 0%, #00BFFF 100%); padding:32px; text-align:center;">
              <div style="display:inline-block; padding:6px 14px; background:rgba(255,255,255,0.18); border-radius:999px; font-size:11px; font-weight:700; color:#ffffff; letter-spacing:1px; text-transform:uppercase; margin-bottom:14px;">🚀 Novo Contato</div>
              <div style="font-size:24px; font-weight:800; color:#ffffff; letter-spacing:-0.3px; line-height:1.2;">{{service}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 32px 8px;">
              <p style="margin:0 0 6px; font-size:11px; color:#94A3B8; text-transform:uppercase; letter-spacing:0.5px; font-weight:600;">De</p>
              <p style="margin:0 0 20px; font-size:17px; font-weight:700; color:#0F172A;">{{from_name}}</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:24px;">
                <tr>
                  <td style="padding:12px 14px; background:#F1F5F9; border-radius:8px;">
                    <p style="margin:0 0 2px; font-size:10px; color:#64748B; text-transform:uppercase; letter-spacing:0.5px; font-weight:600;">E-mail</p>
                    <a href="mailto:{{from_email}}" style="font-size:14px; color:#8B3DF5; text-decoration:none; font-weight:600;">{{from_email}}</a>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 8px; font-size:11px; color:#94A3B8; text-transform:uppercase; letter-spacing:0.5px; font-weight:600;">Mensagem / Briefing</p>
              <div style="padding:18px 20px; background:#FAFBFC; border-left:3px solid #8B3DF5; border-radius:0 8px 8px 0; font-size:14px; line-height:1.65; color:#334155; white-space:pre-wrap;">{{message}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="left">
                <tr>
                  <td style="border-radius:10px; background:linear-gradient(135deg, #8B3DF5 0%, #00BFFF 100%);">
                    <a href="mailto:{{reply_to}}" style="display:inline-block; padding:12px 28px; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px;">Responder ao cliente</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background:#F8FAFC; padding:18px 32px; text-align:center; border-top:1px solid #E2E8F0;">
              <p style="margin:0; font-size:11px; color:#94A3B8;">Recebido via formulário do site codifica.dev</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
